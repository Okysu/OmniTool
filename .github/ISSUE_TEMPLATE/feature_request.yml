name: 功能建议
description: 新工具、新能力或体验改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先查看 [工具矩阵](https://github.com/Okysu/OmniTool/blob/main/docs/design/03-tool-matrix.md)：
        其中列出了已实现、需要决策以及在纯浏览器中无法可靠实现的能力。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你的使用场景，而不仅仅是想要的功能。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
  - type: dropdown
    id: kind
    attributes:
      label: 类型
      options:
        - 新工具（可以用插件实现）
        - 现有工具的改进
        - 平台功能（工作流、设置、界面等）
        - Plugin API / 宿主能力
        - 文档
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
  - type: checkboxes
    id: plugin
    attributes:
      label: 贡献意愿
      options:
        - label: 我愿意以插件或 Pull Request 的形式参与实现
